[build]
  command = "npm install && npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "18"

# Sitemap: list the final URLs (with the trailing slash the site serves, so
# Google is not sent through a redirect for every page) and leave out the CMS.
[[plugins]]
  package = "@netlify/plugin-sitemap"

  [plugins.inputs]
    trailingSlash = true
    exclude = [
      "./_site/admin/**",
      "./_site/admin/index.html"
    ]

# Keep the CMS out of search results
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Browsers ask for /favicon.ico by default
[[redirects]]
  from = "/favicon.ico"
  to = "/assets/images/favicon-32.png"
  status = 200

# Edition 2 vanity URL with UTM tracking
[[redirects]]
  from = "/edition2"
  to = "/reports/edition-2/?utm_source=linkedin&utm_medium=social&utm_campaign=edition2_launch"
  status = 302

# Redirect /admin to the CMS
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

# Withdrawn weekly briefs (20 November 2026): 9 with fewer than three items and
# 4 that duplicated or overlapped a kept brief. Each old URL points to the
