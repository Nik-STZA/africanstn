[build]
  command = "npm install && npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "18"

# Enable Netlify Identity for CMS login
[[plugins]]
  package = "@netlify/plugin-sitemap"

# Edition 2 vanity URL with UTM tracking
[[redirects]]
  from = "/edition2"
  to = "/reports/edition-2/?utm_source=linkedin&utm_medium=social&utm_campaign=edition2_launch"
  status = 302

# Redirect /admin to the CMS
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200
